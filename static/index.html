<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneThread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: topic map on the left, the single conversation on the right. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e4e2dc;
  --accent:#3d5afe; --on-accent:#ffffff; --chip-bg:#eef0ff;
  --font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --display:"Space Grotesk","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15161a; --panel:#1d1f24; --ink:#ececf0; --muted:#9a9ea8; --line:#2c2f36;
  --accent:#8c9eff; --on-accent:#10131f; --chip-bg:#262a3d; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);display:flex}
button{font:inherit;color:inherit}

aside{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 8px;font:700 20px var(--display);letter-spacing:-.01em}
.brand small{display:block;font:400 12px var(--font);color:var(--muted);letter-spacing:0}
.topics-head{padding:12px 20px 6px;font-size:12px;color:var(--muted);letter-spacing:.08em}
#topics{overflow-y:auto;padding:0 10px 16px;flex:1}
.topic{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;
  padding:10px 10px;cursor:pointer;transition:background .15s}
.topic:hover,.topic.active{background:var(--bg)}
.topic .row{display:flex;align-items:center;gap:8px;font-weight:500}
.topic .count{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic .sum{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topic.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--chip-bg)}100%{background:transparent}}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.empty{padding:12px 10px;color:var(--muted);font-size:13px}

main{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow-y:auto;padding:28px max(16px,calc((100% - 760px)/2)) 12px}
.msg{margin:0 0 22px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.bubble{max-width:82%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.assistant .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-end;max-width:82%}
.chip{border:0;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;cursor:pointer;
  background:var(--chip-bg);display:inline-flex;align-items:center;gap:6px}
.chip:hover{outline:1px solid var(--accent)}
.chip .new{font-size:11px;color:var(--accent);font-weight:700}
.related{font-size:12px;color:var(--muted);margin-top:6px}
.related b{font-weight:500;color:var(--ink)}
.thinking .bubble{color:var(--muted)}

form{display:flex;gap:10px;padding:14px max(16px,calc((100% - 760px)/2)) 20px;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  font:inherit;background:var(--panel);color:var(--ink);min-height:46px;max-height:160px}
textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
form button{border:0;border-radius:12px;padding:0 18px;background:var(--ink);color:var(--bg);font-weight:500;cursor:pointer}
form button:disabled{opacity:.5;cursor:default}

.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px;width:230px}
.pop h4{margin:4px 8px 6px;font-size:12px;color:var(--muted);font-weight:500}
.pop button.opt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;
  text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer}
.pop button.opt:hover{background:var(--bg)}
.pop input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:13px}

#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);padding:22px;overflow-y:auto;z-index:15}
#drawer h2{font:700 20px var(--display);margin:0 0 4px;display:flex;align-items:center;gap:10px}
#drawer .label{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:18px 0 6px}
#drawer .summary{background:var(--bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
#drawer .seg{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
#drawer .seg .who{font-size:11px;color:var(--muted)}
#drawer .close{position:absolute;right:16px;top:16px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}

@media (max-width:760px){aside{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand">OneThread<small>只有一个对话框，话题自己归档</small></div>
  <div class="topics-head">话题</div>
  <div id="topics"><div class="empty">还没有话题。随便聊点什么，它会自己归类。</div></div>
</aside>

<main>
  <div id="log"></div>
  <form id="f">
    <textarea id="input" rows="1" placeholder="想到什么说什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</main>

<div id="drawer" hidden></div>

<script>
const $ = s => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");
let topics = [];

const HUES = [228, 12, 150, 280, 40, 190, 330, 95, 255, 60];
const color = id => `hsl(${HUES[id % HUES.length]} 70% 55%)`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function renderTopics(flashIds = []) {
  const box = $("#topics");
  if (!topics.length) { box.innerHTML = '<div class="empty">还没有话题。随便聊点什么，它会自己归类。</div>'; return; }
  box.innerHTML = topics.map(t => `
    <button class="topic ${flashIds.includes(t.id) ? "flash" : ""}" data-id="${t.id}">
      <div class="row"><span class="dot" style="background:${color(t.id)}"></span>${esc(t.name)}
        <span class="count">${t.segment_count}</span></div>
      <div class="sum">${esc(t.summary || "摘要整理中…")}</div>
    </button>`).join("");
  box.querySelectorAll(".topic").forEach(b => b.onclick = () => openTopic(+b.dataset.id));
}

async function loadTopics(flashIds) { topics = await api("/api/topics"); renderTopics(flashIds); }

function chipHTML(seg, isNew) {
  return `<button class="chip" data-seg="${seg.id}" title="点击可改归类">
    <span class="dot" style="background:${color(seg.topic_id)}"></span>
    ${isNew ? '<span class="new">新</span>' : ""}${esc(seg.topic_name)}</button>`;
}

function addUser(text, segments = [], newIds = []) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div><div class="chips"></div>`;
  log.appendChild(el);
  setChips(el, segments, newIds);
  return el;
}

function setChips(el, segments, newIds = []) {
  const seen = new Set();
  const chips = segments.filter(s => !seen.has(s.topic_id) && seen.add(s.topic_id));
  el.querySelector(".chips").innerHTML = chips.map(s => chipHTML(s, newIds.includes(s.topic_id))).join("");
  el.querySelectorAll(".chip").forEach(c => c.onclick = e => openMove(e, +c.dataset.seg, el, segments));
}

function addAssistant(text, related = []) {
  const el = document.createElement("div");
  el.className = "msg assistant";
  const rel = related.length
    ? `<div class="related">联想到：${related.map(r => `<b>${esc(r.topic_name)}</b>`).join("、")}</div>` : "";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>${rel}`;
  log.appendChild(el);
  return el;
}

const scrollDown = () => log.scrollTop = log.scrollHeight;

async function send(text) {
  sendBtn.disabled = true;
  const userEl = addUser(text);
  const wait = addAssistant("…");
  wait.classList.add("thinking");
  scrollDown();
  try {
    const r = await api("/api/chat", {method: "POST", body: JSON.stringify({text})});
    const newIds = r.segments.filter(s => s.is_new_topic).map(s => s.topic_id);
    setChips(userEl, r.segments, newIds);
    wait.remove();
    addAssistant(r.reply, r.related);
    await loadTopics(r.segments.map(s => s.topic_id));
    setTimeout(() => loadTopics(), 2500);   // summaries update in the background
  } catch (e) {
    wait.querySelector(".bubble").textContent = "出错了：" + e.message;
  } finally {
    sendBtn.disabled = false; scrollDown(); input.focus();
  }
}

function closePop() { document.querySelector(".pop")?.remove(); }

function openMove(ev, segId, msgEl, segments) {
  ev.stopPropagation(); closePop();
  const seg = segments.find(s => s.id === segId);
  const pop = document.createElement("div");
  pop.className = "pop";
  const others = topics.filter(t => t.id !== seg.topic_id);
  pop.innerHTML = `<h4>这句其实属于…</h4>
    ${others.map(t => `<button class="opt" data-id="${t.id}"><span class="dot" style="background:${color(t.id)}"></span>${esc(t.name)}</button>`).join("")}
    <input id="newTopic" placeholder="或输入新话题名，回车">`;
  document.body.appendChild(pop);
  const r = ev.currentTarget.getBoundingClientRect();
  pop.style.top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 10) + "px";
  pop.style.left = Math.max(10, Math.min(r.left, innerWidth - 240)) + "px";
  const done = async body => {
    const res = await api(`/api/segments/${segId}/move`, {method: "POST", body: JSON.stringify(body)});
    seg.topic_id = res.topic_id; seg.topic_name = res.topic_name;
    setChips(msgEl, segments); closePop(); loadTopics([res.topic_id]);
  };
  pop.querySelectorAll(".opt").forEach(b => b.onclick = () => done({topic_id: +b.dataset.id}));
  const inp = pop.querySelector("#newTopic");
  inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) done({new_topic: inp.value.trim()}); };
}
document.addEventListener("click", e => { if (!e.target.closest(".pop")) closePop(); });

async function openTopic(id) {
  const t = await api(`/api/topics/${id}`);
  const d = $("#drawer");
  d.innerHTML = `<button class="close" aria-label="关闭">×</button>
    <h2><span class="dot" style="background:${color(t.id)};width:12px;height:12px"></span>${esc(t.name)}</h2>
    <div class="label">摘要</div><div class="summary">${esc(t.summary || "摘要整理中…")}</div>
    <div class="label">归到这里的内容（${t.segments.length}）</div>
    ${t.segments.slice().reverse().map(s => `<div class="seg"><div class="who">${s.role === "user" ? "你" : "AI"}</div>${esc(s.text.slice(0, 280))}</div>`).join("")}`;
  d.hidden = false;
  d.querySelector(".close").onclick = () => d.hidden = true;
  document.querySelectorAll(".topic").forEach(b => b.classList.toggle("active", +b.dataset.id === id));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#drawer").hidden = true; closePop(); } });

$("#f").onsubmit = e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = ""; input.style.height = "";
  send(text);
};
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#f").requestSubmit(); } };
input.oninput = () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; };

(async function boot() {
  await loadTopics();
  for (const m of await api("/api/messages")) {
    if (m.role === "user") addUser(m.content, m.segments);
    else addAssistant(m.content);
  }
  scrollDown(); input.focus();
})();
</script>
</body>
</html>
